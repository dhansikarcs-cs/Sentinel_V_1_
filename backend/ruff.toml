target-version = "py311"
line-length = 120

[lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "SIM", "TCH"]
ignore = ["E501", "B008", "UP007"]

[lint.isort]
known-first-party = ["app"]

[lint.per-file-ignores]
"seed_demo.py" = ["E402"]
"alembic/env.py" = ["E402"]
"conftest.py" = ["E402", "F401", "SIM105"]
