services:
  - type: web
    name: sentinel-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    plan: starter
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./data/sentinel.db
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://sentinel-frontend.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: HELPLINE_EMAIL
        sync: false

  - type: web
    name: sentinel-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    plan: starter
    envVars:
      - key: BACKEND_URL
        value: https://sentinel-backend.onrender.com
