databases:
  - name: sentinel-db
    databaseName: sentinel
    user: sentinel
    plan: starter
    region: oregon

services:
  - type: web
    name: sentinel-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://sentinel-frontend.onrender.com
      - key: RUN_WORKERS
        value: "false"
      - key: RATE_LIMIT_BACKEND
        value: "db"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CRISIS_HELPLINE_EMAIL
        sync: false

  - type: worker
    name: sentinel-scheduler
    # Runs with a PostgreSQL advisory lock so multiple replicas are failover-safe:
    # exactly one active scheduler drives the reminder/celebration loops. To scale
    # out, increase the instance count on this worker; the rest stand by.
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    command: python -m app.workers.runner
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RUN_WORKERS
        value: "true"

  - type: web
    name: sentinel-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    plan: starter
    envVars:
      - key: BACKEND_URL
        value: https://sentinel-backend.onrender.com